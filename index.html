<script>
const $=s=>document.querySelector(s),K='dutyRoster.v2';
const DN=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'],DS=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];

const LB={M:'সকাল',E:'বিকাল',N:'রাত',R:'রেস্ট',P:'অনুমতি ছুটি',V:'নৈমিত্তিক ছুটি',T:'ট্রেনিং',O:'অপারেশন',C:'রাত-পরবর্তী','':'—'};
const SB={M:'স',E:'বি',N:'রা',R:'রে',P:'অ',V:'নৈ',T:'ট্র',O:'অপ',C:'পর','':'·'};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dt=k=>new Date(k+'T00:00:00');

 if(dw===5||dw===6)return dE()?`<div class="card noprint" style="margin-bottom:12px"><div class="t" style="margin:0">শুক্র ও শনিবার সাপ্তাহিক ছুটির দিন, তাই এ দুই দিনে সরকারি ছুটির অতিরিক্ত রেস্ট প্রযোজ্য নয়।</div></div>`:'';
 if(dE())return`<div class="card noprint" style="margin-bottom:12px"><label style="font-weight:600"><input type="checkbox" ${on?'checked':''} onchange="setHol(this.checked)"> এই দিনটি সরকারি ছুটির দিন</label>${on?` <input id="hn" placeholder="ছুটির নাম (ঐচ্ছিক)" value="${esc(S.hol[cur])}" onchange="setHolName(this.value)" style="margin-left:8px">`:''}<div class="t" style="margin:6px 0 0">সরকারি ছুটির দিনে যারা সকাল বা বিকাল শিফটে ডিউটি করবেন, ওই সপ্তাহে তাঁদের প্রাপ্য রেস্ট ১ দিন বেড়ে যাবে। যাঁরা এদিন রেস্টে থাকবেন তাঁদেরও একই নিয়ম, ফলে ওই রেস্ট অতিরিক্ত গণ্য হবে না (প্রাপ্য রেস্ট = সাপ্তাহিক সর্বোচ্চ রেস্ট + ছুটির দিনের সংখ্যা)।</div></div>`;
 return on?`<div class="card" style="margin-bottom:12px"><b style="color:var(--L)">সরকারি ছুটির দিন</b>${S.hol[cur]?' – '+esc(S.hol[cur]):''}</div>`:''}
function setHol(v){if(!dE())return;if(v){if(S.hol[cur]===undefined)S.hol[cur]=''}else delete S.hol[cur];if(S.conf[cur])S.dirty[cur]=1;save();render()}
function setHolName(v){if(!dE()||S.hol[cur]===undefined)return;S.hol[cur]=v.trim();save()}
function togRes(){if(!isA())return;S.resOn=!S.resOn;save();render()}
function resPanel(){if(!S.asg[cur]||!dE())return'';if(!isA()&&!S.resOn)return'';
 const l=S.staff.filter(p=>act(p,cur)&&!'PVTO'.includes(st(cur,p.id)||'-'));
 const sel=p=>{const e=dbl2(cur,p.id),v=e==='M'?'ME':e==='E'?'EN':'';return`<select onchange="setDbl('${p.id}',this.value)"><option value="">সাধারণ (এক শিফট)</option>${DBLP.map(z=>`<option value="${z[0]}"${v===z[0]?' selected':''}>${z[1]}</option>`).join('')}</select>`};
 return`<div class="card noprint" style="margin-top:12px"><h3><span>রিজার্ভ কর্মচারী</span><span style="display:flex;gap:8px;align-items:center"><span class="cnt s-R">${bn(l.filter(p=>dbl2(cur,p.id)).length)} জন</span></span></h3><div class="t">যাঁকে পরপর দুই শিফটে ডিউটি দেবেন তাঁর পাশে শিফট জোড়া বেছে নিন। তিনি দুটি শিফটের তালিকাতেই আসবেন এবং তাঁর জন্য ১ দিন বকেয়া রেস্ট যোগ হবে। “নতুন করে সাজান” চাপলে এই দিনের দুই শিফট মুছে যায়।</div>${l.map(p=>`<div class="row"><span>${nmH(p)} <small style="color:var(--mut)">(এখন: ${LB[st(cur,p.id)]})</small></span>${sel(p)}</div>`).join('')||'<div class="t">কেউ নেই</div>'}</div>`}
function setDbl(id,v){if(!dE()||!S.asg[cur])return;if(v&&!isA()&&!S.resOn)return;S.dbl=S.dbl||{};const m=S.dbl[cur]=S.dbl[cur]||{};
 if(!v){delete m[id]}else{const q=DBLP.find(z=>z[0]===v),s=st(cur,id);if(!q||(s&&'PVTO'.includes(s)))return;S.asg[cur][id]=q[3];m[id]=q[2]}
 syncLv(cur);if(S.conf[cur])S.dirty[cur]=1;save();render()}
function daily(){
 if(!S.asg[cur])return limNote()+holBox()+`<div class="card empty"><h3 style="justify-content:center">এই দিনের রোস্টার এখনও তৈরি হয়নি</h3><p class="t">কর্মীদের আগের রেস্ট ও রাতের ডিউটি হিসাব করে স্বয়ংক্রিয় রোস্টার তৈরি হবে।</p>${dE()?'<button onclick="mk()">রোস্টার তৈরি করুন</button>':''}</div>`;
 const opt=(p,sc)=>{const s=st(cur,p.id),ex=sc&&sc!==s&&dbl2(cur,p.id)===sc;return`<div class="row"><span>${nmH(p)}${bx(p,cur)}</span>${dE()?(ex?`<button class="o noprint" style="padding:3px 10px;font-size:12px" onclick="setDbl('${p.id}','')">দুই শিফট বাতিল</button>`:`<select onchange="setS('${p.id}',this.value)">${'MENRPVTO'.split('').map(o=>`<option value="${o}"${s===o?' selected':''}>${LB[o]}</option>`).join('')}${s==='C'?'<option value="C" selected>রাত-পরবর্তী</option>':''}${s===''?'<option selected>নির্ধারিত নয়</option>':''}</select>`):''}</div>`};
 const cardsA=(dE()?['M','E','N','R','P','V','T','O','C','']:['M','E','N','R','LV','T']).map(s=>{if(s==='LV'){const q=VS(cur,cur).filter(p=>'PV'.includes(st(cur,p.id)||'-'));if(!q.length)return'';return`<div class="card cl"><h3><span>ছুটি</span><span class="cnt">${bn(q.length)} জন</span></h3><div class="t">আজ ছুটিতে আছেন</div>${q.map(p=>`<div class="row"><span>${nmH(p)} <small style="color:var(--mut)">(${st(cur,p.id)==='P'?'অনুমতি ছুটি':'নৈমিত্তিক ছুটি'})</small></span></div>`).join('')}</div>`}const l=VS(cur,cur).filter(p=>(st(cur,p.id)===s||(s!==''&&dbl2(cur,p.id)===s))&&(s!==''||act(p,cur)));if(!l.length&&'PVTCO'.includes(s)||(!l.length&&s==='R'&&!dE())||(!l.length&&s===''))return'';
  const nm=SH[s]?SH[s][0]:(s===''?'নির্ধারিত নয়':LB[s]),tm=SH[s]?tmS(s):s==='R'?'আজ বিশ্রামে':s==='C'?'গতরাতের ডিউটি চলমান, রেস্ট গণ্য নয়':s==='P'?'অনুমতি ছুটিতে':s==='V'?'নৈমিত্তিক ছুটিতে':s==='T'?'ট্রেনিংয়ে':s==='O'?'অপারেশনে':'';
  return`<div class="card${SH[s]||s==='R'?' sh-'+s:''}${!dE()&&s==='T'?' ct':!dE()&&s==='R'?' cr':''}"><h3><span>${nm}</span><span class="cnt s-${s||'x'}">${bn(l.length)} জন</span></h3><div class="t">${tm}</div>${l.map(p=>opt(p,s)).join('')||'<div class="t">কেউ নেই</div>'}</div>`});
 const cards=`<div class="card wdblock"><h2>${DN[dt(cur).getDay()]}<small>${bn(dt(cur).getDate())} ${MN[dt(cur).getMonth()]} ${bn(dt(cur).getFullYear())}</small></h2><div class="grid">${cardsA.slice(0,4).join('')}</div></div>${cardsA.slice(4).join('')}`;
 const lg=S.log.find(l=>l.d===cur&&l.k!=='ok'),cf=S.conf[cur],dy=S.dirty[cur],sb=cf?(dy?'<b style="color:var(--L)">⚠ সংরক্ষণের পর পরিবর্তন হয়েছে, আবার ওকে চাপুন</b>':'<b style="color:var(--R)">✔ সংরক্ষিত</b>')+' – '+stamp(cf.t)+' (সংশোধনী '+bn(cf.rev)+')':'এখনও সংরক্ষণ করা হয়নি';
 return limNote()+holBox()+`<div class="grid">${cards}</div>${resPanel()}${dE()?`<div class="card noprint" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><div class="t" style="margin:0">${sb}<br>${lg?'রোস্টার তৈরি: '+stamp(lg.t)+' ('+esc(lg.u)+')':''}</div>${dE()?`<div style="display:flex;gap:8px"><button class="o" onclick="mk()">নতুন করে সাজান</button><button onclick="ok()">${cf?'ওকে (সংশোধন সংরক্ষণ)':'ওকে'}</button></div>`:''}</div>`:''}`}

/* সাজানো (ছোট→বড় / বড়→ছোট): সাপ্তাহিক – রেস্ট ও বকেয়া/অতিরিক্ত; মাসিক – রেস্ট। ডিফল্টে বন্ধ */
let WS={k:'',d:''},MS={k:'',d:''},WK='',MK='';
const SCN={r:'এই সপ্তাহে রেস্ট',b:'বকেয়া/অতিরিক্ত রেস্ট'};
function sAct(v,d){return v==='w'?(WS.k!==''&&WK==='w'+wStart(d)):(MS.k!==''&&MK==='m'+d.slice(0,7))}
function sApply(v,d,list,val){if(!sAct(v,d))return list;const m=(v==='w'?WS:MS).d==='desc'?-1:1;return list.map((p,i)=>[p,i]).sort((a,b)=>(val(a[0])-val(b[0]))*m||a[1]-b[1]).map(x=>x[0])}
function sLab(v,d){if(!sAct(v,d))return'';const o=v==='w'?WS:MS;return'  |  ক্রম: '+(v==='w'?SCN[o.k]:o.k==='t'?'সর্বমোট অফ-ডে':'রেস্ট')+' ('+(o.d==='desc'?'বড় থেকে ছোট':'ছোট থেকে বড়')+')'}
function cyc(t,k){const o=t==='w'?WS:MS;if(o.k===k){if(o.d==='asc')o.d='desc';else{o.k='';o.d=''}}else{o.k=k;o.d='asc'}render()}
function clrS(t){if(t==='w')WS={k:'',d:''};else MS={k:'',d:''};render()}
const sBtn=(t,k)=>{const o=t==='w'?WS:MS,on=o.k===k;return`<div class="noprint"><button type="button" class="sb${on?' on':''}" onclick="cyc('${t}','${k}')" title="চাপলে ক্রম বদলাবে: ছোট→বড়, বড়→ছোট, আগের ক্রম">${on?(o.d==='desc'?'▼ বড়→ছোট':'▲ ছোট→বড়'):'⇅ সাজান'}</button></div>`};
const sNote=t=>{const o=t==='w'?WS:MS;return o.k!==''?`<div class="note noprint" style="margin-bottom:10px">সাজানো আছে (${sLab(t,cur).replace(/^\s*\|\s*ক্রম: /,'')})। PDF বা ডাউনলোড এই ক্রমেই হবে। <a href="#" onclick="clrS('${t}');return false">আগের ক্রমে ফিরুন</a></div>`:''};
function weekly(){const ws=wStart(cur),ds=[...Array(7)].map((_,i)=>addDays(ws,i)),C=calc(ds[6]),Q=qFor(ws);
 const qpBox=p=>{if(!wE()||!S.qpOn)return'';const has=((S.qp||{})[p.id]||{})[ws]!==undefined;return`<div class="noprint" style="margin:3px 0 0;font-size:11px;color:var(--M);white-space:normal">সর্বোচ্চ রেস্ট: <input type="number" min="0" max="7" value="${qP(p,ws)}" style="width:54px;padding:2px 4px;text-align:center${has?';border:2px solid #f2b134':''}" onchange="setQp('${p.id}',this.value)">${has?` <a href="#" style="color:inherit" onclick="clrQp('${p.id}');return false">সাধারণে ফিরুন</a>`:''}</div>`};
 const base=VS(ws,addDays(ws,6)).filter(p=>inWk(p,ws)).sort((a,b)=>C[a.id].close-C[b.id].close),rx=p=>ds.filter(k=>st(k,p.id)==='R').length;const rows=sApply('w',cur,base,p=>WS.k==='r'?rx(p):C[p.id].close).map(p=>{let x=0;const Qp=qP(p,ws);const c=ds.map(k=>{const s=st(k,p.id),e=dbl2(k,p.id);if(s==='R')x++;return`<td${wkd(k)?' class="fr"':''}>${e?`<span class="chip s-${e}">${LB[e]}</span><br>`:''}<span class="chip s-${s||'x'}">${LB[s]}</span></td>`}).join(''),o=C[p.id],cl=o.close>0?'var(--L)':o.close===0?'var(--R)':'var(--ink)';
  return`<tr><td class="n">${nmH(p)}${qpBox(p)}</td>${c}<td>${bn(x)}<div class="t" style="margin:2px 0 0;font-size:11px">প্রাপ্য: ${bn(Math.max(0,Qp+o.hb+o.dbl-o.open))}${o.hb||o.dbl||o.open?' ('+bn(Qp)+(o.hb?' + '+bn(o.hb):'')+(o.dbl?' + '+bn(o.dbl)+' দুই শিফট':'')+(o.open>0?' − '+bn(o.open)+' আগের অতিরিক্ত':o.open<0?' + '+bn(-o.open)+' আগের বকেয়া':'')+')':''}</div></td><td><input type="text" inputmode="numeric"${wE()?'':' readonly'} value="${fs(o.close)}" title="আগের সপ্তাহ: ${fs(o.open)} | এ সপ্তাহে রেস্ট ${bn(o.taken)} − সীমা ${bn(o.exp)}${o.bonus?' − রাত-পরবর্তী বোনাস '+bn(o.bonus):''}${o.hb?' − সরকারি ছুটির দিনের ডিউটি/রেস্ট '+bn(o.hb):''}${o.dbl?' − পরপর দুই শিফটের বকেয়া '+bn(o.dbl):''}${o.adj?' | নিজে বসানো সমন্বয় '+fs(o.adj):''}" style="width:64px;text-align:center;font-weight:700;color:${cl}${o.adj?';border-color:var(--M)':''}" onchange="setAdj('${p.id}',this.value)"><div class="t" style="margin:2px 0 0;font-size:11px">আগের সপ্তাহ: ${fs(o.open)}<br>পরের সপ্তাহে জের: ${fs(o.close)}</div></td></tr>`}).join('');
 const qc=wE()&&ws<=wStart(today())&&(!S.base||ws>=S.base.w)?`<div class="noprint" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px"><label>এ সপ্তাহের সর্বোচ্চ রেস্ট${S.qo[ws]!==undefined?' <b style="color:var(--M)">(সংশোধিত)</b>':''}:</label><input type="number" min="0" max="7" id="qo" value="${Q}" style="width:70px"><button onclick="setQo()">সংশোধন সংরক্ষণ</button>${S.qo[ws]!==undefined?'<button class="o" onclick="clrQo()">সেটিংসের সংখ্যায় ফিরুন</button>':''}</div>`:'';
 return`<div class="card">${limNoteW()}${qc}${sNote('w')}<div class="tw"><table class="wkt"><tr><th class="n">কর্মী</th>${ds.map(k=>`<th${wkd(k)?' class="fr"':''}>${DS[dt(k).getDay()]}<br><small>${bn(dt(k).getDate())}/${bn(dt(k).getMonth()+1)}</small>${isH(k)?'<br><small style="color:var(--L);font-weight:700">সরকারি ছুটি</small>':''}</th>`).join('')}<th>এই সপ্তাহে রেস্ট<br><small>(সর্বোচ্চ ${bn(Q)})</small>${sBtn('w','r')}</th><th>বকেয়া রেস্ট/<br>অতিরিক্ত রেস্ট<br><small>(- বাকি, + অতিরিক্ত)</small>${sBtn('w','b')}</th></tr>${rows}</table></div>
 ${isA()?`<p class="note">সেটিংসে প্রতি কর্মীর সাপ্তাহিক সর্বোচ্চ রেস্ট ধরা আছে ${bn(Q)} দিন। হিসাব: <b>আগের সপ্তাহের ব্যালেন্স + এ সপ্তাহে নেওয়া রেস্ট − সাপ্তাহিক সর্বোচ্চ রেস্ট − সরকারি ছুটির দিনের ডিউটি/রেস্ট সংখ্যা</b>। কেউ সীমার কম রেস্ট পেলে “-” চিহ্নসহ বাকি, সীমার বেশি নিলে “+” চিহ্নসহ অতিরিক্ত দেখায়। <b style="color:var(--L)">লাল</b> = সীমার চেয়ে অতিরিক্ত রেস্ট (+), <b style="color:var(--R)">সবুজ</b> = কোনো রেস্ট বাকি নেই (০), <b>কালো</b> = রেস্ট বাকি আছে (-)। এই সপ্তাহের শেষ ব্যালেন্সই পরের সপ্তাহের শুরুর ব্যালেন্স হয়, আর আগের সপ্তাহের শেষ ব্যালেন্স এ সপ্তাহের “আগের সপ্তাহ” ঘরে দেখা যায়। রাতের পরদিন সকাল, বিকাল বা আবার রাতে ডিউটি করলে ১ দিন বকেয়া যোগ হয়। কোনো কর্মচারী একই দিনে পরপর দুই শিফটে (সকাল+বিকাল বা বিকাল+রাত) ডিউটি করলে তাঁর ১ দিন বকেয়া রেস্ট যোগ হয় (প্রাপ্য রেস্ট = সাপ্তাহিক সর্বোচ্চ রেস্ট + দুই শিফটের দিনের সংখ্যা) এবং ওই দিনের ঘরে দুটি শিফটই দেখানো হয়। সরকারি ছুটির দিনে (শুক্র ও শনিবার বাদে) কেউ সকাল/বিকাল শিফটে ডিউটি করলে অথবা রেস্টে থাকলে ওই সপ্তাহে তাঁর প্রাপ্য রেস্ট প্রতিদিনের জন্য ১ দিন করে বাড়ে (প্রাপ্য রেস্ট = সাপ্তাহিক সর্বোচ্চ রেস্ট + ছুটির দিনের সংখ্যা), তাই সেই রেস্ট অতিরিক্ত গণ্য হয় না। আগের সপ্তাহের অতিরিক্ত রেস্ট (+) এ সপ্তাহের প্রাপ্য থেকে বিয়োগ হয়; বিয়োগের পরও অতিরিক্ত বাকি থাকলে তা পরের সপ্তাহের প্রাপ্য থেকে বিয়োগ হয়। আগের বকেয়া রেস্ট এ সপ্তাহে কাটালেও তা অতিরিক্ত গণ্য হয় না; বকেয়া না থাকা অবস্থায় প্রাপ্যের বেশি রেস্ট নিলেই কেবল “+” অতিরিক্ত হয় এবং তা পরের সপ্তাহে সমন্বয় হয়। ঘরে সংখ্যা লিখে (যেমন -২ বা +১) নিজে বসানো যায় (হলুদ বর্ডার মানে নিজে বসানো); তা পরের সপ্তাহগুলোতেও ধরা হয়। সেটিংসে “আলাদা সর্বোচ্চ রেস্ট বসানোর ঘর” চালু করলে যেকোনো কর্মীর নামের নিচের ঘরে ওই সপ্তাহের জন্য আলাদা সর্বোচ্চ রেস্ট বসানো যায় (হলুদ বর্ডার মানে নিজে বসানো)।</p>`:''}</div>${rview()}`}

function exM(){if(!isA())return;const mu='font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.6',ex=S.ex||[];
 dlg(`<h3>সাবেক কর্মীদের তালিকা</h3><div style="margin:16px 0 8px;padding:10px 12px;border-radius:12px;background:rgba(239,131,80,.14);border:1px solid rgba(239,131,80,.5)"><h3 style="margin:0 0 6px;font-size:15px">সাবেক কর্মী</h3>${ex.length?ex.map(p=>`<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:var(--card)"><div class="sr" style="margin:0;flex-wrap:wrap"><input value="${esc(p.name)}" readonly style="flex:1 1 100%"><button style="flex:1 1 auto;background:var(--pri);color:#fff;border:none;font-weight:600;box-shadow:0 2px 6px rgba(15,122,136,.28)" onclick="rejoin('${p.id}')">${rjPend===p.id?'হ্যাঁ, নিশ্চিত – যুক্ত করুন':'পুনরায় কর্মী তালিকায় যুক্ত করুন'}</button>${rjPend===p.id?'<button class="o" style="flex:1 1 auto" onclick="rejoinNo()">বাতিল</button>':''}<button class="d" style="flex:1 1 auto" onclick="delPerm('${p.id}')">চিরতরে মুছুন</button></div><div style="${mu}">${p.jd?`যোগের তারিখ: ${fdl(p.jd)}<br>`:''}বাদ দেওয়ার তারিখ: ${fdl(p.left)}${p.jd?`<br>সময়কাল: ${tnTxt(p.jd,p.left)}`:''}</div></div>`).join(''):`<div style="${mu}">কোনো সাবেক কর্মী নেই।</div>`}</div><div class="sr" style="margin-top:10px"><button class="o" onclick="staffM()">← কর্মী তালিকায় ফিরে যান</button></div>`)}
function edSync(m){const g=i=>$('#'+i);if(m===0){const t=tenure(g('ed').value||today(),today());g('ey').value=t[0];g('em').value=t[1];g('edd').value=t[2]}else{const d=dt(today());d.setFullYear(d.getFullYear()-(+g('ey').value||0));d.setMonth(d.getMonth()-(+g('em').value||0));d.setDate(d.getDate()-(+g('edd').value||0));g('ed').value=fmt(d)}}
function edSave(id){if(!isA())return;const p=S.staff.find(x=>x.id===id);if(!p)return;const n=$('#en').value.trim(),d=$('#ed').value;if(!n||!d)return;p.name=n;p.nick=$('#ek').value.trim();if($('#er')){const nr=$('#er').value;if(nr!==rkOf(p)){if(nr)p.rank=nr;else delete p.rank;S.staff=S.staff.filter(x=>x!==p);S.staff.push(p)}}p.jd=d;if($('#enw').checked)p.from=d;else delete p.from;sortStaff();save();render();staffM()}
function del(id){if(!isA())return;const p=S.staff.find(x=>x.id===id);if(!p)return;(S.ex=S.ex||[]).push({id:p.id,name:p.name,nick:p.nick,jd:p.jd,from:p.from,rank:p.rank,left:today()});S.staff=S.staff.filter(x=>x.id!==id);S.accts=(S.accts||[]).filter(a=>a.sid!==id);{const t0=today();Object.keys(S.asg).forEach(k=>{if(k>=t0&&S.asg[k])delete S.asg[k][id]});Object.keys(S.lv).forEach(k=>{if(k>=t0&&S.lv[k]){delete S.lv[k][id];if(!Object.keys(S.lv[k]).length)delete S.lv[k]}})}save();render();staffM()}
function restoreTrash(){const t=S.trash||[];t.forEach(bk=>{const id=bk.p.id;
 Object.keys(bk.asg).forEach(k=>{if(S.asg[k]){S.asg[k][id]=bk.asg[k];syncLv(k)}});
 Object.keys(bk.adj).forEach(w=>{(S.adj[w]=S.adj[w]||{})[id]=bk.adj[w]});
 if(bk.qp)S.qp[id]=bk.qp;
 [['lvo',bk.lvo],['lpo',bk.lpo]].forEach(([n,o])=>{const m=(S[n]=S[n]||{});Object.keys(o).forEach(y=>{(m[y]=m[y]||{})[id]=o[y]})});
 if(bk.base!==null&&S.base&&S.base.w===bk.baseW)S.base.b[id]=bk.base;
 if(!S.gone.some(x=>x.id===id)&&!(S.ex||[]).some(x=>x.id===id))S.gone.push(bk.p)});S.trash=[]}
/* ব্রাউজারের confirm/alert/prompt অনেক জায়গায় ব্লক থাকে, তাই অ্যাপের নিজস্ব বার্তা-উইন্ডো */
function uiAsk(msg,o,cb){o=o||{};const d=$('#cfm');
 d.innerHTML='<div style="font-size:15px;line-height:1.7;margin-bottom:10px">'+esc(msg)+'</div>'+(o.input!==undefined?'<input id="cfmIn" style="width:100%" value="'+esc(o.input)+'">':'')+'<div class="r">'+(o.cancel?'<button class="o" id="cfmNo">'+(o.noText||'না')+'</button>':'')+'<button id="cfmYes"'+(o.danger?' class="d"':'')+'>'+(o.yesText||'ঠিক আছে')+'</button></div>';
 $('#cfmYes').onclick=()=>{const v=o.input!==undefined?$('#cfmIn').value:true;d.close();if(cb)cb(v)};
 if(o.cancel)$('#cfmNo').onclick=()=>d.close();
 if(o.input!==undefined)$('#cfmIn').onkeydown=e=>{if(e.key==='Enter')$('#cfmYes').click()};
 if(!d.open)d.showModal()}
const uiAlert=m=>uiAsk(m),uiConfirm=(m,cb,y)=>uiAsk(m,{cancel:1,danger:1,yesText:y||'হ্যাঁ'},cb);
function delPerm(id){if(!isA())return;const p=(S.ex||[]).find(x=>x.id===id);if(!p)return;uiConfirm('“'+p.name+'” কে সাবেক কর্মীর তালিকা থেকে চিরতরে মুছে ফেলবেন? এটি আর ফেরানো যাবে না। (পুরোনো রোস্টারে তাঁর আগের রেকর্ড থাকবে)',()=>{S.ex=S.ex.filter(x=>x.id!==id);(S.gone=S.gone||[]).push(p);save();render();exM()},'হ্যাঁ, চিরতরে মুছুন')}
let rjPend='';
function rejoin(id){if(!isA())return;const p=(S.ex||[]).find(x=>x.id===id);if(!p)return;if(rjPend!==id){rjPend=id;exM();return}rjPend='';S.ex=S.ex.filter(x=>x.id!==id);const q={id:p.id,name:p.name,nick:p.nick,jd:p.jd,from:p.from,rank:p.rank};S.staff.push(q);sortStaff();addAcct(S,q);save();render();exM()}

function add(){if(!isA())return;const v=$('#nn').value.trim();if(!v)return;const nsf={id:'s'+(++S.nid),name:v,nick:$('#nk').value.trim(),jd:today(),from:today()};const nr=$('#nr')?$('#nr').value:'';if(nr)nsf.rank=nr;insertAt(nsf,$('#np')?$('#np').value:'bottom');sortStaff();addAcct(S,nsf);save();render();staffM()}
function rkOf(p){return S.ranks&&p.rank&&S.ranks.some(r=>r.id===p.rank)?p.rank:''}
function sortStaff(){const ix=p=>{const k=rkOf(p);return k?S.ranks.findIndex(r=>r.id===k):1e9};S.staff.sort((a,b)=>ix(a)-ix(b))}
function posOpts(rid){const g=S.staff.filter(p=>rkOf(p)===(rid||''));let o='<option value="bottom">সবার নিচে (সবচেয়ে জুনিয়র)</option>';if(g.length)o+='<option value="top">সবার উপরে (সবচেয়ে সিনিয়র)</option>'+g.map(p=>`<option value="${p.id}">${esc(p.name)} এর পরে</option>`).join('');return o}

function insertAt(q,pv){const rk=rkOf(q),g=S.staff.filter(x=>rkOf(x)===rk);let i=S.staff.length;if(pv==='top'&&g.length)i=S.staff.indexOf(g[0]);else if(pv&&pv!=='top'&&pv!=='bottom'){const t=g.find(x=>x.id===pv);if(t)i=S.staff.indexOf(t)+1}S.staff.splice(i,0,q)}

function rankM(){if(!isA())return;const mu='font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.6',Rk=S.ranks;dlg(`<h3>পদবী</h3><div style="${mu}">তালিকার ক্রম হলো সবচেয়ে সিনিয়র থেকে জুনিয়র। ↑ ↓ চেপে ক্রম বদলান। পদবী যুক্ত করা ঐচ্ছিক।</div>${Rk.length?Rk.map((r,i)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:var(--card)"><div class="sr" style="margin:0"><input value="${esc(r.name)}" readonly><button class="o" ${i?'':'disabled'} onclick="rkMv('${r.id}',-1)">↑</button><button class="o" ${i<Rk.length-1?'':'disabled'} onclick="rkMv('${r.id}',1)">↓</button></div><div class="sr"><button class="o" onclick="rkRen('${r.id}')">নাম বদলান</button><button class="d" onclick="rkDel('${r.id}')">মুছুন</button></div><div style="${mu}">এই পদবীতে কর্মী: ${bn(S.staff.filter(p=>rkOf(p)===r.id).length)} জন</div></div>`).join(''):`<div style="${mu};margin:10px 0">এখনো কোনো পদবী যুক্ত হয়নি। পদবী না দিলেও কর্মী তালিকায় ↑ ↓ বাটন ও কর্মী যোগের সময় “সিনিয়রিটি অবস্থান” দিয়ে সিনিয়র-জুনিয়র ক্রম ঠিক করা যায়।</div>`}<div class="sr" style="margin-top:10px"><input id="rn" placeholder="নতুন পদবীর নাম" onkeydown="if(event.key==='Enter')rkAdd()"><button onclick="rkAdd()">যোগ করুন</button></div><div style="${mu}">নতুন পদবী তালিকার সবার নিচে (সবচেয়ে জুনিয়র) যোগ হবে।</div><div class="sr" style="margin-top:10px"><button class="o" onclick="setM()">← সেটিংসে ফিরে যান</button></div>`)}
function rkAdd(){if(!isA())return;const v=$('#rn').value.trim();if(!v)return;if(S.ranks.some(r=>r.name===v)){uiAlert('এই নামে পদবী আগে থেকেই আছে');return}S.rnid=(S.rnid||0)+1;S.ranks.push({id:'r'+S.rnid,name:v});save();rankM()}

function rkDel(id){if(!isA())return;const r=S.ranks.find(x=>x.id===id);if(!r)return;const n=S.staff.filter(p=>rkOf(p)===id).length;uiConfirm('“'+r.name+'” পদবী মুছবেন?'+(n?' এই পদবীর '+n+' জন কর্মীর পদবী থাকবে না এবং তাঁরা তালিকার নিচে চলে যাবেন।':''),()=>{S.ranks=S.ranks.filter(x=>x.id!==id);S.staff.forEach(p=>{if(p.rank===id)delete p.rank});sortStaff();save();render();rankM()},'হ্যাঁ, মুছুন')}
